services:
  ingest: &pipeline
    build: .
    # Ollama del host en Linux; habilitar host networking en Docker Desktop.
    network_mode: host
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    env_file: .env
    environment:
      CONTENT_DIR: /app/content
      STATE_DIR: /app/.pipeline
    volumes:
      - ${CONTENT_VOLUME:-./content}:/app/content
      - ${STATE_VOLUME:-./.pipeline}:/app/.pipeline
  worker:
    <<: *pipeline
    command: ["serve"]
    restart: unless-stopped
    stop_grace_period: ${SERVICE_STOP_GRACE_PERIOD:-5m}
    profiles: ["worker"]
  index:
    build: .
    network_mode: host
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    env_file: .env
    working_dir: /data
    entrypoint: ["python", "-m", "lupita", "index"]
    volumes:
      # El directorio permite reemplazar el índice atómicamente.
      - .:/data
