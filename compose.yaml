services:
  ingest:
    build: .
    # El Ollama del host queda accesible en localhost en Linux.
    network_mode: host
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    env_file: .env
    environment:
      CONTENT_DIR: /app/content
      STATE_DIR: /app/.pipeline
    volumes:
      - ./content:/app/content
      - ./.pipeline:/app/.pipeline
  index:
    build: .
    network_mode: host
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /data
    entrypoint: ["python", "-m", "lupita", "index"]
    volumes:
      # Montar el directorio permite reemplazar el índice de forma atómica.
      - .:/data
