baseURL = 'https://lupitacr.com/'
locale = 'es-cr'
defaultContentLanguage = 'es'
title = 'Lupita'
theme = 'main'
removePathAccents = true
enableRobotsTXT = true

[params]
  description = 'Lupita reúne noticias recientes de medios costarricenses en un solo lugar. Explora titulares, resúmenes y temas, y consulta siempre la fuente original.'
  image = 'https://images.pexels.com/photos/23136417/pexels-photo-23136417.jpeg'
  image_credit = 'Foto de Alejandro Orozco en Pexels'
  image_credit_url = 'https://www.pexels.com/photo/23136417/'

[module.hugoVersion]
  min = '0.158.0'

[taxonomies]
  category = 'category'
  topic = 'topics'

[pagination]
  pagerSize = 50

[[menus.main]]
  identifier = 'search'
  name = 'Buscar'
  pageRef = '/'
  weight = 40

[[menus.footer]]
  name = 'Categorías'
  pageRef = '/category'
  weight = 10

[[menus.footer]]
  name = 'Temas'
  pageRef = '/topics'
  weight = 20

[[menus.footer]]
  name = 'Acerca de'
  pageRef = '/about'
  weight = 30

[[menus.footer]]
  identifier = 'archive'
  name = 'Archivo'
  pageRef = '/archive'
  weight = 25
