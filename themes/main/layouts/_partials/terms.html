{{- /* Renders the terms of the given taxonomy assigned to the page. */}}
{{- with .page.GetTerms .taxonomy }}
  <div>
    {{- if eq $.taxonomy "topics" }}<hr>{{ end }}
    <div>
      {{- range $index, $term := . -}}
        {{- if $index }} | {{ end -}}
        <a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>
      {{- end }}
    </div>
  </div>
{{- end }}
