<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}" dir="{{ or site.Language.Direction `ltr` }}">
<head>
  {{ partial "head.html" . }}
</head>
<body{{ if .IsHome }} class="home"{{ end }}>
  <header>
    {{ partial "header.html" . }}
  </header>
  <main>
    {{ partial "breadcrumbs.html" . }}
    {{ block "main" . }}{{ end }}
  </main>
  <footer>
    {{ partial "footer.html" . }}
  </footer>
</body>
</html>
